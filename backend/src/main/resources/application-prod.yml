server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: projectpulse-backend
  profiles:
    active: prod

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/projectpulse?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:projectpulse_user}
    password: ${MYSQL_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  h2:
    console:
      enabled: false

projectpulse:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  admin:
    initial-email: ${ADMIN_INITIAL_EMAIL:admin@projectpulse.io}
    initial-password: ${ADMIN_INITIAL_PASSWORD}
    initial-name: ${ADMIN_INITIAL_NAME:System Administrator}
  blockchain:
    enabled: ${FABRIC_ENABLED:false}
    channel-name: ${FABRIC_CHANNEL_NAME:projectpulse-channel}
    chaincode-name: ${FABRIC_CHAINCODE_NAME:activitytracker}
    network-config-path: ${FABRIC_NETWORK_CONFIG_PATH:blockchain-network/connection-org1.json}
    msp-id: ${FABRIC_MSP_ID:Org1MSP}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    enabled: false  # disable Swagger UI in production

logging:
  level:
    root: INFO
    io.projectpulse: INFO
    org.springframework.security: INFO