
name: ProjectPulse Maven CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build and Test Spring Boot Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build using Composite Action
        uses: ./.github/actions/maven-build
        with:
          java-version: '21'
          admin-initial-password: 'TestOnlyPassword123!'
          jwt-secret: ${{ secrets.JWT_SECRET }}

  deploy:
    name: Deploy to AWS EC2
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-south-1
      INSTANCE_ID: i-0b20d87986cabb97f
      S3_BUCKET: projectpulse-deploy-artifacts-756429941212

    steps:
      - name: Download Maven Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: projectpulse-backend-jar
          path: ./artifact

      - name: Debug GitHub OIDC Claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            core.info(JSON.stringify({
              iss: payload.iss,
              aud: payload.aud,
              sub: payload.sub,
              repository: payload.repository,
              ref: payload.ref
            }, null, 2));

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload JAR to S3
        run: |
          aws s3 cp \
            ./artifact/projectpulse-backend-1.0.0.jar \
            s3://${S3_BUCKET}/projectpulse-backend-1.0.0.jar

      - name: Deploy JAR and Restart Application
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ProjectPulse Spring Boot application" \
            --parameters '{"commands":[
              "aws s3 cp s3://projectpulse-deploy-artifacts-756429941212/projectpulse-backend-1.0.0.jar /opt/projectpulse/projectpulse-backend-1.0.0.jar",
              "chown ec2-user:ec2-user /opt/projectpulse/projectpulse-backend-1.0.0.jar",
              "systemctl restart projectpulse",
              "systemctl is-active projectpulse"
            ]}' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"; then

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
              --output json

            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text
